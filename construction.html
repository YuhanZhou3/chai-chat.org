<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt: #1c1b1a;
    --asphalt-2: #131211;
    --safety-orange: #e8600a;
    --caution-yellow: #ffc72c;
    --barrier-white: #f2ede4;
    --rust: #3a2e22;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--barrier-white);
    background: var(--asphalt);
    padding: 6vh 5vw;
  }

  /* Blurred, darkened copy of the SAME photo, filling the whole page
     so the foreground image blends into it instead of sitting on a
     blank field. */
  body::before {
    content: "";
    position: fixed;
    inset: -5%;
    background-image:
      linear-gradient(180deg, rgba(18,17,16,0.55) 0%, rgba(18,17,16,0.78) 55%, rgba(18,17,16,0.94) 100%),
      url("https://www.mtlblog.com/media-library/montreal-construction-cones-and-detour-signs-in-the-bed-of-a-truck.jpg?id=31797409&width=1200&height=600&coordinates=0%2C15%2C0%2C15");
    background-size: cover;
    background-position: center;
    filter: blur(38px) saturate(1.15) brightness(0.75);
    transform: scale(1.12);
    z-index: 0;
  }

  /* Faint hazard-stripe wash over the blur for texture, low opacity */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(255, 199, 44, 0.05) 0px,
      rgba(255, 199, 44, 0.05) 26px,
      transparent 26px,
      transparent 52px
    );
    z-index: 0;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 720px;
    width: 100%;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--caution-yellow);
    margin: 0 0 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .beacon {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--safety-orange);
    box-shadow: 0 0 0 0 rgba(232, 96, 10, 0.6);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(232, 96, 10, 0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(232, 96, 10, 0); }
    100% { box-shadow: 0 0 0 0 rgba(232, 96, 10, 0); }
  }

  /* Photo frame: hazard-stripe border, slight tilt, soft shadow so
     the sharp photo reads as an object sitting on the blurred field */
  .frame {
    padding: 10px;
    background: repeating-linear-gradient(
      45deg,
      var(--caution-yellow) 0px,
      var(--caution-yellow) 18px,
      var(--asphalt-2) 18px,
      var(--asphalt-2) 36px
    );
    border-radius: 4px;
    transform: rotate(-1.6deg);
    box-shadow:
      0 25px 50px -12px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(0, 0, 0, 0.3);
    margin-bottom: 34px;
    max-width: min(88vw, 560px);
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 1px;
    filter: saturate(1.05) contrast(1.03);
  }

  h1 {
    font-family: 'Big Shoulders Stencil Text', sans-serif;
    font-weight: 900;
    font-size: clamp(2.6rem, 8vw, 4.6rem);
    line-height: 0.95;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--caution-yellow);
    margin: 0 0 14px;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.55);
  }

  h1 .dots {
    display: inline-block;
    animation: blink 1.6s steps(1) infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  p.sub {
    margin: 0;
    font-size: 0.92rem;
    color: rgba(242, 237, 228, 0.82);
    letter-spacing: 0.01em;
    max-width: 46ch;
  }

  p.sub strong {
    color: var(--barrier-white);
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .beacon, h1 .dots { animation: none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <p class="eyebrow"><span class="beacon"></span> Site status: active work zone</p>

    <div class="frame">
      <img
        src="https://www.mtlblog.com/media-library/montreal-construction-cones-and-detour-signs-in-the-bed-of-a-truck.jpg?id=31797409&width=1200&height=600&coordinates=0%2C15%2C0%2C15"
        alt="Traffic cones and detour signs loaded in the bed of a truck">
    </div>

    <h1>Under Construction<span class="dots">...</span></h1>
    <p class="sub">We're paving the streets for something new. <strong>So you can truly get to know the people living within them! </strong></p>
  </div>

</body>
</html>
